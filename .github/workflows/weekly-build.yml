name: Weekly Build

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx-node
            tag: latest
          - image: nginx-php
            tag: latest
          - image: mariadb
            tag: latest
          # Pinned release series: moves with patch releases and config changes, never across series.
          - image: mariadb
            tag: '12.3'
            build-args: MARIADB_VERSION=12.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}:${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          push: true
          pull: true
          build-args: ${{ matrix.build-args }}
          tags: ghcr.io/ame180/${{ matrix.image }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.tag }}
